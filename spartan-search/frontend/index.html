<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spartan Search: describe what happens, and find the video and the seconds that match." />
    <meta name="theme-color" content="#f5f5f7" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("spartan.theme");
          var dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.dataset.theme = "dark";
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#000000");
          }
        } catch (e) {}
      })();
    </script>
    <title>Spartan Search</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
